# Development overrides for Visual Studio / local Docker Compose.
# Keeps the same ports and connection settings as docker-compose.yml.
services:
  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  sqlserver-microservices:
    ports:
      - "1433:1433"

  workorders-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  assets-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  technicians-service:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  orchestration-service:
    environment:
      - DOTNET_ENVIRONMENT=Development
