services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver-microservices:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sqlserver-microservices
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "if [ -f /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd' -C -Q 'SELECT 1' || exit 1; fi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - microservices-network

  database-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: database-init
    depends_on:
       sqlserver-microservices:
        condition: service_healthy
    volumes:
      - ./init.sql:/init.sql
    command:
      - /bin/bash
      - -c
      - |
        echo "Running database initialization..."
        # Try mssql-tools18 first (newer), fall back to mssql-tools (older)
        if [ -f /opt/mssql-tools18/bin/sqlcmd ]; then
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver-microservices -U sa -P "YourStrong@Passw0rd" -C -i /init.sql
        else
          /opt/mssql-tools/bin/sqlcmd -S sqlserver-microservices -U sa -P "YourStrong@Passw0rd" -C -i /init.sql
        fi
        if [ $? -eq 0 ]; then
          echo "Database initialization complete!"
        else
          echo "ERROR: Database initialization failed"
          exit 1
        fi
    networks:
      - microservices-network

  orchestration-service:
    build:
      context: .
      dockerfile: src/services/Orchestration.Service/Orchestration/Dockerfile
    container_name: orchestration-service
    environment:
      - DOTNET_ENVIRONMENT=Development
      - ConnectionStrings__SagaDb=Server=sqlserver-microservices,1433;Database=OrchestrationDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__WriteDb=Server=sqlserver-microservices,1433;Database=OrchestrationDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__RabbitMQ=rabbitmq://rabbitmq:5672
    networks:
      - microservices-network
    depends_on:
      sqlserver-microservices:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  workorders-service:
    build:
      context: .
      dockerfile: src/services/WorkOrders.Service/CleanArchitecture.Cmms.Api.WorkOrders/Dockerfile
    container_name: workorders-service
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_URLS=http://+:5001
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WriteDb=Server=sqlserver-microservices,1433;Database=WorkOrdersDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__ReadDb=Server=sqlserver-microservices,1433;Database=WorkOrdersDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__RabbitMQ=rabbitmq://rabbitmq:5672
    networks:
      - microservices-network
    depends_on:
      sqlserver-microservices:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  assets-service:
    build:
      context: .
      dockerfile: src/services/Assets.Service/CleanArchitecture.Cmms.Api.Assets/Dockerfile
    container_name: assets-service
    ports:
      - "5002:5002"
    environment:
      - ASPNETCORE_URLS=http://+:5002
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WriteDb=Server=sqlserver-microservices,1433;Database=AssetsDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__ReadDb=Server=sqlserver-microservices,1433;Database=AssetsDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__RabbitMQ=rabbitmq://rabbitmq:5672
    networks:
      - microservices-network
    depends_on:
      sqlserver-microservices:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  technicians-service:
    build:
      context: .
      dockerfile: src/services/Technicians.Service/CleanArchitecture.Cmms.Api.Technicians/Dockerfile
    container_name: technicians-service
    ports:
      - "5003:5003"
    environment:
      - ASPNETCORE_URLS=http://+:5003
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__WriteDb=Server=sqlserver-microservices,1433;Database=TechniciansDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__ReadDb=Server=sqlserver-microservices,1433;Database=TechniciansDb;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;
      - ConnectionStrings__RabbitMQ=rabbitmq://rabbitmq:5672
    networks:
      - microservices-network
    depends_on:
      sqlserver-microservices:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  swagger-hub:
    image: nginx:1.27-alpine
    container_name: swagger-hub
    ports:
      - "5080:80"
    volumes:
      - ./docker/swagger-hub/index.html:/usr/share/nginx/html/index.html:ro
      - ./docker/swagger-hub/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - microservices-network
    depends_on:
      workorders-service:
        condition: service_started
      assets-service:
        condition: service_started
      technicians-service:
        condition: service_started

networks:
  microservices-network:
    driver: bridge

volumes:
  rabbitmq_data:
  sql_data:
